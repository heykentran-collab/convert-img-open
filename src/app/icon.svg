<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="volticen-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Squircle rounded background -->
  <rect width="32" height="32" rx="7.5" fill="url(#volticen-bg)" />
  <rect width="30" height="30" x="1" y="1" rx="6.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  
  <!-- Volticen Layers Emblem -->
  <g filter="url(#glow)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="16 6.5 6.5 11 16 15.5 25.5 11" fill="rgba(255,255,255,0.18)" />
    <polyline points="6.5 16 16 20.5 25.5 16" />
    <polyline points="6.5 21 16 25.5 25.5 21" />
  </g>
</svg>